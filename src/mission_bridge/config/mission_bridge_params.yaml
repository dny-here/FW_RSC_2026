mission_bridge:
  ros__parameters:
    dz_index: 0
    # WAJIB DIISI: wp_seq item LOITER_TURNS DZ di mission Mission Planner.
    # -1 = sentinel "belum dikonfigurasi" -> gate otorisasi drop NONAKTIF (aman secara
    # default, tapi drop TIDAK PERNAH akan diotorisasi sampai nilai ini diisi).
    dz_loiter_wp_index: -1
    plan_wait_timeout: 20.0      # s: batas tunggu AirdropPlan setelah loiter -> gagal
    approach_timeout: 60.0       # s: backstop bila RELEASED tak pernah terlihat
    entry_reach_radius: 30.0     # m: dianggap sampai di entry point p
    guided_mode_name: "GUIDED"
    auto_mode_name: "AUTO"
