airdrop_planner:
  ros__parameters:
    ballistic:
      mass_kg: 0.5
      drag_coeff: 0.8       # ganti sesuai drop test
      ref_area_m2: 0.01     # sesuaikan bentuk payload
      air_density: 1.225
      dt: 0.005

    approach:
      release_alt_agl: 100.0
      release_airspeed: 18.0    # m/s, samakan dgn TRIM_ARSPD_CM ArduPilot
      distance: 300.0           # d — final approach; perbesar jika transien roll besar
      loiter_radius: 80.0
      min_wind_for_heading: 1.0

    release:
      proximity_radius: 3.0      # release proximity circle
      mechanism_latency: 0.15     # s: servo + pintu bay terbuka
      entry_capture_radius: 25.0  # cross-track maksimum saat melewati p
      heading_tolerance: 0.35     # rad (~20 deg) alignment course vs approach
      speed_reduction: 0.0        # m/s — paper: 2.0 bila motor DIMATIKAN
                                  # sebelum rilis; 0 bila motor tetap on
      gps_latency: 0.1            # s — proyeksi posisi (paper Sec. 5.4)
      drop_ack_timeout: 2.0       # s — tunggu ACK DO_SET_SERVO

    mission:
      num_payloads: 2
      max_replans: 3              # missed target

    drop:
      servo_channel_bay: [11, 12]  # channel servo bay 0 dan bay 1 (SERVOx ArduPilot), possibly ganti
      pwm_release: 1900           # PWM posisi "lepas"

    topics:
      global_position: "mavros/global_position/global"
      velocity: "mavros/local_position/velocity_local"   # ENU, bukan odom.twist
      wind: "mavros/wind_estimation"
      command_service: "mavros/cmd/command"

mission_bridge:
  ros__parameters:
    mission:
      loiter_radius: 80.0
      overshoot_distance: 150.0
      acceptance_radius: 0.0
      topics.status: "airdrop/status"

    topics:
      plan: "airdrop/plan"
      global_position: "mavros/global_position/global"
      waypoint_push_service: "mavros/mission/push"
